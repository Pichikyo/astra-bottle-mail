name: Publish approved letters
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source:
        description: 'Publication trigger source'
        required: false
        default: 'manual'
        type: string
      revision:
        description: 'Requested feed revision'
        required: false
        default: '0'
        type: string
  schedule:
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch approved letters
        run: node sync.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public feed
        run: node sync.mjs --verify
